// ============================================================
// FUNCSHOONO
// ============================================================

function getGrade(avg) {
    if (avg >= 91) return "A+";
    if (avg >= 86) return "A";
    if (avg >= 81) return "A-";
    if (avg >= 76) return "B+";
    if (avg >= 71) return "B";
    if (avg >= 66) return "B-";
    if (avg >= 61) return "C+";
    if (avg >= 56) return "C";
    if (avg >= 50) return "C-";
    if (avg >= 41) return "D";
    return "F";
}

function searchStudent() {
    const input = document.getElementById('rollInput');
    const roll = parseInt(input.value.trim());
    const msg = document.getElementById('msg');
    const card = document.getElementById('card');

    msg.className = 'msg';
    msg.style.display = 'none';
    card.classList.remove('show');

    if (isNaN(roll)) {
        msg.textContent = '❌ Fadlan geli lambar sax ah (tusaale: 1101)';
        msg.className = 'msg error';
        msg.style.display = 'block';
        return;
    }

    const student = students.find(s => s.roll === roll);

    if (!student) {
        msg.textContent = '❌ Lamaan helin arday leh Roll No: ' + roll;
        msg.className = 'msg error';
        msg.style.display = 'block';
        return;
    }

    const subs = student.sub;
    const scores = Object.values(subs);
    const total = scores.reduce((a, b) => a + b, 0);
    const count = scores.length;
    const avg = total / count;
    const passed = avg >= 50;
    const grade = passed ? 'GUDBAY' : 'DHACAY';
    const level = getGrade(avg);

    document.getElementById('sName').textContent = student.name;
    document.getElementById('sRoll').textContent = student.roll;
    document.getElementById('sClass').textContent = 'Fasalka: ' + student.class;
    document.getElementById('total').textContent = total;
    document.getElementById('avg').textContent = avg.toFixed(2);
    document.getElementById('count').textContent = count;
    document.getElementById('levelDisplay').textContent = level;

    const gradeEl = document.getElementById('gradeDisplay');
    gradeEl.textContent = grade;
    gradeEl.className = 'grade' + (passed ? '' : ' fail');

    const tbody = document.getElementById('subjectsBody');
    tbody.innerHTML = '';
    for (const [name, score] of Object.entries(subs)) {
        const tr = document.createElement('tr');
        const passClass = score >= 50 ? 'pass' : 'fail';
        tr.innerHTML = `
            <td class="subject">${name}</td>
            <td style="text-align:right;">
                <span class="score ${passClass}">${score}</span>
            </td>
        `;
        tbody.appendChild(tr);
    }

    msg.textContent = '✅ Natiijada ' + student.name + ' ee Sanad dugsiyeedka 2025-2026!';
    msg.className = 'msg success';
    msg.style.display = 'block';
    card.classList.add('show');
}

// ============================================================
// DHACDOOYINKA
// ============================================================

document.getElementById('searchBtn').addEventListener('click', searchStudent);
document.getElementById('rollInput').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') searchStudent();
});

window.addEventListener('load', function() {
    document.getElementById('rollInput').focus();
});
</script>
