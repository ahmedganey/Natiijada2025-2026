        .search-box {

            flex-wrap: wrap;

            background: #f2f7fc;
            padding: 16px 20px;
            border-radius: 16px;
            margin-bottom: 20px;
            align-items: center;
        }
        .search-box input {
            flex: 1;
            min-width: 180px;
            padding: 12px 16px;
            border: 2px solid #cbdae9;
            border-radius: 40px;
            font-size: 16px;
            outline: none;
            background: #fff;
        }

        .search-box button {
            background: #1a6b3f;
            color: #fff;
            border: none;
            padding: 12px 32px;
            border-radius: 40px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }
        .search-box button:hover { background: #0f4f2e; transform: scale(1.02); }
        .msg {
            text-align: center;
            padding: 14px;
            border-radius: 12px;
            margin-bottom: 16px;
            display: none;
        }
        .msg.error { display: block; background: #fee9e7; color: #b33a34; border-left: 6px solid #b33a34; }
        .msg.success { display: block; background: #e3f3e9; color: #1e6f3f; border-left: 6px solid #1e6f3f; }
        .card { display: none; animation: fadeIn 0.4s ease; }
        .card.show { display: block; }
        @keyframes fadeIn { 0% { opacity:0; transform:translateY(20px); } 100% { opacity:1; transform:translateY(0); } }
        .result-header {
            background: linear-gradient(145deg, #0b2545, #1a3a6b);
            color: #fff;
            padding: 16px 22px;
            border-radius: 16px 16px 0 0;

            justify-content: space-between;
            align-items: center;

        .score.fail { color: #b33a34; }
        .footer {

            .result-header { flex-direction: column; align-items: flex-start; gap: 8px; padding: 14px 16px; }
            .result-header .name { font-size: 18px; }
            .stats { flex-direction: column; gap: 6px; padding: 12px 16px; }

            th, td { padding: 6px 8px; }

// ============================================================
// FUNCSHOONO - WAXAA HALKAN KA BILAABANAYA QAYBTA SHAQAYSA
// ============================================================

function getGrade(avg) {
    if (avg >= 91) return "A+";
    if (avg >= 86) return "A";
    if (avg >= 81) return "A-";
    if (avg >= 76) return "B+";
    if (avg >= 71) return "B";
    if (avg >= 66) return "B-";
    if (avg >= 61) return "C+";
    if (avg >= 56) return "C";
    if (avg >= 50) return "C-";
    if (avg >= 41) return "D";
    return "F";
}

function searchStudent() {
    const input = document.getElementById('rollInput');
    const roll = parseInt(input.value.trim());
    const msg = document.getElementById('msg');
    const card = document.getElementById('card');

    // Qarso kaarka bilowga
    msg.className = 'msg';
    msg.style.display = 'none';
    card.classList.remove('show');

    // Hubi inuu yahay lambar
    if (isNaN(roll)) {
        msg.textContent = '❌ Fadlan geli lambar sax ah (tusaale: 913)';
        msg.className = 'msg error';
        msg.style.display = 'block';
        return;
    }

    // Raadi ardayga
    const student = students.find(s => s.roll === roll);

    if (!student) {
        msg.textContent = '❌ Lamaan helin arday leh Roll No: ' + roll;
        msg.className = 'msg error';
        msg.style.display = 'block';
        return;
    }

    // Xisaabi natiijada
    const subs = student.sub;
    const scores = Object.values(subs);
    const total = scores.reduce((a, b) => a + b, 0);
    const count = scores.length;
    const avg = total / count;
    const passed = avg >= 50;
    const grade = passed ? 'GUDBAY' : 'DHACAY';
    const level = getGrade(avg);

    // Buuxi kaarka
    document.getElementById('sName').textContent = student.name;
    document.getElementById('sRoll').textContent = student.roll;
    document.getElementById('sClass').textContent = 'Fasalka: ' + student.class;
    document.getElementById('total').textContent = total;
    document.getElementById('avg').textContent = avg.toFixed(2);
    document.getElementById('count').textContent = count;
    document.getElementById('levelDisplay').textContent = level;

    const gradeEl = document.getElementById('gradeDisplay');
    gradeEl.textContent = grade;
    gradeEl.className = 'grade' + (passed ? '' : ' fail');

    // Buuxi miisaanka maaddooyinka
    const tbody = document.getElementById('subjectsBody');
    tbody.innerHTML = '';
    for (const [name, score] of Object.entries(subs)) {
        const tr = document.createElement('tr');
        const passClass = score >= 50 ? 'pass' : 'fail';
        tr.innerHTML = `
            <td class="subject">${name}</td>
            <td style="text-align:right;">
                <span class="score ${passClass}">${score}</span>
            </td>
        `;
        tbody.appendChild(tr);
    }

    // Muuji kaarka
    msg.textContent = '✅ Natiijada ' + student.name + ' ee Sanad dugsiyeedka 2025-2026!';
    msg.className = 'msg success';
    msg.style.display = 'block';
    card.classList.add('show');
}

// ============================================================
// DHACDOOYINKA (EVENTS)
// ============================================================

document.getElementById('searchBtn').addEventListener('click', searchStudent);

document.getElementById('rollInput').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
        searchStudent();
    }
});

// Marka bogga la furo, diiradda saar sanduuqa raadinta
window.addEventListener('load', function() {
    document.getElementById('rollInput').focus();
});
</script>
